// TTT Classic server configuration.
//
// Copy to $SERVER_PATH/config/server.cfg and edit. This file lives OUTSIDE the
// Steam installation and is copied into the active release on every start, so
// it survives game updates and rollbacks.
//
// Derived from the server.default.cfg shipped with the dedicated server.
// The full cvar reference is in the developer's guide:
// https://steamcommunity.com/sharedfiles/filedetails/?id=3751635002

hostname "TTT Classic Server"
sv_password ""
sv_lan 0
// Region: 0=US East, 1=US West, 2=South America, 3=Europe, 4=Asia,
//         5=Australia, 6=Middle East, 7=Africa, 255=World
sv_region 255

sv_aim 0
sv_clienttrace 3.5
pausable 0
sv_maxspeed 220
sv_spectatormaxspeed 1500

// --- rates ---
sv_maxrate 25000
sv_minrate 5000
sv_maxupdaterate 60
sv_minupdaterate 20

// --- round flow ---
mp_maxrounds 6
mp_timelimit 75
mp_chattime 10
ttt_detective_mode "1"
ttt_minimum_players "4"
ttt_waiting_enabled "1"
ttt_preptime_seconds "30"
ttt_firstpreptime "60"
ttt_haste "1"
ttt_roundtime_minutes "10"
ttt_haste_starting_minutes "5"
ttt_posttime_seconds "30"
ttt_idle_limit "180"

// --- roles ---
ttt_traitor_pct "0.25"
ttt_detective_pct "0.13"
ttt_detective_min_players "8"

// --- karma ---
ttt_karma "1"
ttt_karma_strict "1"
ttt_karma_low_autokick "1"
ttt_karma_low_ban "1"
ttt_karma_low_ban_minutes "60"

// --- Steam voice ---
// This port must match VOICE_PORT in .env, be published by Docker, and be open
// in your firewall. Protocol 1 (Steam P2P relay) is the default; protocols 0
// and 2 REQUIRE the port to be reachable.
ttt_steam_voice "1"
ttt_steam_voice_port "27030"
ttt_steam_voice_protocol "1"
ttt_steam_voice_positional "1"

// --- logging ---
log on
mp_logdetail 3

// Ban lists and the RCON password are kept out of this file.
// rcon.cfg is git-ignored; create it yourself with:
//   echo 'rcon_password "choose-something-long"' > $SERVER_PATH/config/rcon.cfg
//   chmod 640 $SERVER_PATH/config/rcon.cfg
exec listip.cfg
exec banned.cfg
exec rcon.cfg
